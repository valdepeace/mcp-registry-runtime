name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [registry, runtime, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (${{ matrix.app }})
        run: npm run typecheck -w @mcp/${{ matrix.app }}

      - name: Build (${{ matrix.app }})
        run: npm run build -w @mcp/${{ matrix.app }}
